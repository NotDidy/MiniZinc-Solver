<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>FIT2102 A2 2026 - MiniZinc Solver</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                max-width: 1000px;
                margin: 40px auto;
                padding: 0 20px;
                line-height: 1.5;
            }

            h1 {
                margin-bottom: 8px;
            }

            p {
                margin-top: 0;
                color: #444;
            }

            main {
                display: flex;
                flex-direction: column;
                gap: 16px;
            }

            label {
                font-weight: bold;
            }

            textarea,
            output {
                width: 100%;
                box-sizing: border-box;
                font-family: monospace;
                font-size: 14px;
                border: 1px solid #ccc;
                border-radius: 6px;
                padding: 12px;
            }

            textarea {
                min-height: 300px;
                resize: vertical;
            }

            output {
                display: block;
                min-height: 120px;
                white-space: pre-wrap;
                background: #f8f8f8;
            }

            button {
                width: fit-content;
                padding: 10px 18px;
                font-size: 14px;
                border: 1px solid #333;
                border-radius: 6px;
                background: white;
                cursor: pointer;
            }

            button:hover {
                background: #f0f0f0;
            }

            button:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }

            .options-row {
                display: flex;
                align-items: center;
                gap: 16px;
                flex-wrap: wrap;
            }

            .checkbox-label {
                display: flex;
                align-items: center;
                gap: 6px;
                font-weight: normal;
                cursor: pointer;
            }

            .checkbox-label input[type="checkbox"] {
                width: 16px;
                height: 16px;
            }

            .solutions-container {
                display: none;
            }

            .solutions-container.visible {
                display: block;
            }

            .stats-panel {
                background: #f0f4f8;
                border: 1px solid #d0d8e0;
                border-radius: 6px;
                padding: 12px 16px;
                margin-bottom: 12px;
                font-size: 13px;
            }

            .stats-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
                gap: 8px 16px;
            }

            .stat-item {
                display: flex;
                flex-direction: column;
                gap: 2px;
            }

            .stat-label {
                color: #666;
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }

            .stat-value {
                font-family: monospace;
                font-weight: 500;
                color: #222;
            }

            .solutions-list {
                max-height: 400px;
                overflow-y: auto;
                border: 1px solid #ddd;
                border-radius: 6px;
                background: white;
            }

            .solution-item {
                padding: 10px 12px;
                border-bottom: 1px solid #eee;
                font-family: monospace;
                font-size: 13px;
            }

            .solution-item:last-child {
                border-bottom: none;
            }

            .solution-item-header {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-bottom: 4px;
            }

            .solution-index {
                color: #888;
                font-size: 12px;
                min-width: 40px;
            }

            .solution-bindings {
                color: #333;
            }

            .simple-output {
                display: block;
            }

            .simple-output.hidden {
                display: none;
            }

            .error-output {
                color: #c62828;
                background: #fdeaea;
            }
        </style>
    </head>
    <body>
        <h1>MiniZinc Solver</h1>
        <p>Enter a MiniZinc model below, then click Run.</p>

        <main>
            <label for="model-input">Model</label>
            <textarea
                id="model-input"
                placeholder="e.g.
var 1..3: x;
var 1..3: y;
constraint x != y;
solve satisfy;"
            ></textarea>

            <div class="options-row">
                <label class="checkbox-label">
                    <input type="checkbox" id="all-solutions-toggle" />
                    <span>Show all solutions & statistics</span>
                </label>
                <div style="flex: 1;"></div>
                <button id="run-model">Run</button>
                <button id="save-solution" disabled>Save Solution</button>
            </div>

            <label for="model-output">Output</label>
            <output id="model-output" class="simple-output"></output>

            <div id="solutions-container" class="solutions-container">
                <div id="stats-panel" class="stats-panel" style="display: none;">
                    <div class="stats-grid">
                        <div class="stat-item">
                            <span class="stat-label">Nodes Explored</span>
                            <span id="stat-nodes" class="stat-value">-</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Solve Time (ms)</span>
                            <span id="stat-time" class="stat-value">-</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Objective Value</span>
                            <span id="stat-objective" class="stat-value">-</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Total Solutions</span>
                            <span id="stat-count" class="stat-value">-</span>
                        </div>
                    </div>
                </div>
                <div id="solutions-list" class="solutions-list"></div>
            </div>
        </main>

        <script type="module" src="./src/main.ts"></script>
    </body>
</html>
